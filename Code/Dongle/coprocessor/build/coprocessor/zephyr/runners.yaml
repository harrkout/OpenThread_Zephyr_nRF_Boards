# Available runners configured by board.cmake.
runners:
- nrfjprog
- jlink
- pyocd

# Default flash runner if --runner is not given.
flash-runner: nrfjprog

# Default debug runner if --runner is not given.
debug-runner: jlink

# Common runner configuration values.
config:
  board_dir: /home/harrkout/zephyr_workspace/ncs/toolchains/v2.9.0/zephyr/boards/nordic/nrf52840dongle
  # Build outputs:
  elf_file: zephyr.elf
  hex_file: /home/harrkout/zephyrproject/harrkout/coprocessor/build/merged.hex
  bin_file: zephyr.bin
  # Host tools:
  gdb: /home/harrkout/zephyr_workspace/ncs/toolchains/toolchains/b77d8c1312/opt/zephyr-sdk/arm-zephyr-eabi/bin/arm-zephyr-eabi-gdb
  openocd: /usr/bin/openocd
  openocd_search:
    - /home/harrkout/zephyr_workspace/ncs/toolchains/toolchains/b77d8c1312/opt/zephyr-sdk/sysroots/x86_64-pokysdk-linux/usr/share/openocd/scripts

# Runner specific arguments
args:
  nrfjprog:
    []

  jlink:
    - --dt-flash=y
    - --device=nRF52840_xxAA
    - --speed=4000
  pyocd:
    - --dt-flash=y
    - --target=nrf52840
    - --frequency=4000000
